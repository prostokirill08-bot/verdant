# Запуск на сервере: sudo bash deploy/bootstrap.sh <домен>
# Вручную: cp .env.example .env && docker compose up -d --build
services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vitrina:${POSTGRES_PASSWORD:-vitrina}@db:5432/vitrina
    volumes: [data:/app/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vitrina:${POSTGRES_PASSWORD:-vitrina}@db:5432/vitrina
    volumes: [data:/app/data]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitrina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrina}
      POSTGRES_DB: vitrina
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrina -d vitrina"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped
volumes:
  data:
  pg:
  caddy_data:

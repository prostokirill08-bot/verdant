# Запуск на своём компьютере без сервера и без вложений: start-local.bat (Windows) или ./start-local.sh
# Только Telegram-бот + админка на http://localhost:8000. Данные — SQLite в томе Docker.
services:
  web:
    build: .
    image: vitrinalab:local
    env_file: .env
    environment:
      DATABASE_URL: ""
      PUBLIC_URL: http://localhost:8000
    ports: ["127.0.0.1:8000:8000"]
    volumes: [data:/app/data]
    restart: unless-stopped
  worker:
    image: vitrinalab:local
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: ""
      PUBLIC_URL: http://localhost:8000
    volumes: [data:/app/data]
    depends_on: [web]
    restart: unless-stopped
volumes:
  data:

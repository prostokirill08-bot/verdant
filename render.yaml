# Render Blueprint: веб-сервис (Docker) + PostgreSQL + Redis (Key Value).
# Render → New → Blueprint → выбрать репозиторий. Пароль админа сгенерируется сам: Dashboard → verdant → Environment.
services:
  - type: web
    name: verdant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: verdant-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: verdant-redis, property: connectionString }
      - key: ADMIN_EMAIL
        value: admin@verdant.local
      - key: ADMIN_PASSWORD
        generateValue: true
  - type: keyvalue
    name: verdant-redis
    plan: free
    ipAllowList: []
databases:
  - name: verdant-db
    plan: free
    databaseName: verdant
    user: verdant
